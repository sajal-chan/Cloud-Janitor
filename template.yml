AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Resources:
  EC2CleanerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_function.lambda_handler
      Runtime: python3.9
      CodeUri: .
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref CleanupNotificationTopic
      Policies:
        - AmazonEC2FullAccess
        - CloudWatchReadOnlyAccess
        - AmazonSNSFullAccess
      Events:
        DailyTrigger:
          Type: Schedule
          Properties:
            Schedule: cron(0 0 * * ? *)   # Every day at 00:00 UTC

  # ----- SNS TOPIC FOR NOTIFICATIONS -----
  CleanupNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: "EC2-Cleanup-Notifications"

  # ----- EMAIL SUBSCRIPTION (YOU) -----
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      TopicArn: !Ref CleanupNotificationTopic
      Endpoint: "sajalchandra124@gmail.com"